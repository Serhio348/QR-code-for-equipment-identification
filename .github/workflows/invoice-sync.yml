name: Sync bvod.by Invoices

# Daily sync runs on the local Windows Task Scheduler
# (ai-consultant-api/scripts/sync-invoices-scheduled.ps1) because bvod.by
# resets TLS from GitHub-hosted / Railway cloud IPs.
# Keep this workflow for manual runs. Hosted runners usually cannot reach bvod.by;
# the supported schedule is the local Windows task, which can set BVOD_HTTP_PROXY.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-consultant-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-consultant-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync invoices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BVOD_LOGIN: ${{ secrets.BVOD_LOGIN }}
          BVOD_PASSWORD: ${{ secrets.BVOD_PASSWORD }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && '1' || '' }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi
          if [ -z "${BVOD_LOGIN:-}" ] || [ -z "${BVOD_PASSWORD:-}" ]; then
            echo "BVOD_LOGIN or BVOD_PASSWORD is missing"
            echo "Add them as GitHub Actions secrets (same values as on Railway)."
            exit 1
          fi

          echo "This workflow does not set BVOD_HTTP_PROXY."
          echo "Hosted runners usually cannot open bvod.by."
          echo "Prefer local Windows Task Scheduler sync-invoices-scheduled.ps1"

          npm run sync-invoices
