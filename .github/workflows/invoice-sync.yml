name: Sync bvod.by Invoices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-consultant-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ai-consultant-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync invoices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BVOD_LOGIN: ${{ secrets.BVOD_LOGIN }}
          BVOD_PASSWORD: ${{ secrets.BVOD_PASSWORD }}
          BVOD_HTTP_PROXY: ${{ secrets.BVOD_HTTP_PROXY }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && '1' || '' }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi
          if [ -z "${BVOD_LOGIN:-}" ] || [ -z "${BVOD_PASSWORD:-}" ]; then
            echo "BVOD_LOGIN or BVOD_PASSWORD is missing"
            echo "Add them as GitHub Actions secrets (same values as on Railway)."
            exit 1
          fi

          if [ -n "${BVOD_HTTP_PROXY:-}" ]; then
            echo "Using BVOD_HTTP_PROXY for portal access"
          else
            echo "No BVOD_HTTP_PROXY set — direct access to bvod.by"
          fi

          npm run sync-invoices
