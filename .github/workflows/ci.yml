name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:run

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-consultant-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-consultant-api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
